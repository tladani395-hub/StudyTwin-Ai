<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B57" />
      <stop offset="60%" stop-color="#9B6EFF" />
      <stop offset="100%" stop-color="#7B4BFF" />
    </linearGradient>
    <radialGradient id="favOrb" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="40%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FF7A00" />
    </radialGradient>
  </defs>

  <!-- Winged Shield Body -->
  <path
    d="M 16 8
       C 13 8, 8 10, 6 14
       C 4.5 17, 5 21.5, 8.5 24.5
       C 11 26.5, 13.5 25.5, 16 23
       C 18.5 25.5, 21 26.5, 23.5 24.5
       C 27 21.5, 27.5 17, 26 14
       C 24 10, 19 8, 16 8 Z"
    fill="#160E28"
    stroke="url(#favGrad)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Crossing Arrow-Tipped Antennae -->
  <!-- Left antenna up-right -->
  <path d="M 15 8 C 14.5 6, 15.5 4.5, 17 3.5 L 19 2" stroke="#FF6B57" stroke-width="1.3" stroke-linecap="round" />
  <polygon points="19,1.2 19.8,2.8 18.2,2.4" fill="#FF6B57" />

  <!-- Right antenna up-left -->
  <path d="M 17 8 C 17.5 6, 16.5 4.5, 15 3.5 L 13 2" stroke="#7B4BFF" stroke-width="1.3" stroke-linecap="round" />
  <polygon points="13,1.2 12.2,2.8 13.8,2.4" fill="#7B4BFF" />

  <!-- Cheeks -->
  <circle cx="11" cy="17" r="1.4" fill="#FF85A1" opacity="0.9" />
  <circle cx="21" cy="17" r="1.4" fill="#FF85A1" opacity="0.9" />

  <!-- Glowing Head Orb -->
  <circle cx="16" cy="13.5" r="2.8" fill="url(#favOrb)" />
  <circle cx="16.7" cy="12.8" r="0.7" fill="#FFFFFF" />

  <!-- Smile -->
  <path d="M 14.5 17.5 Q 16 19.2 17.5 17.5" stroke="#FFB800" stroke-width="0.9" stroke-linecap="round" />
</svg>
